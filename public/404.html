<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SparkleAutoDetail - Luxury Car Spa & Detailing</title>
    <script>
      // Single Page Apps for GitHub Pages SPA redirect
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var redirectPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/#' +
        redirectPath +
        (l.search ? l.search : '')
      );
    </script>
  </head>
  <body style="background-color: #070B12; color: #94A3B8; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to SparkleAutoDetail...</p>
  </body>
</html>
